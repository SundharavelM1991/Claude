<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KidConnect – Login Preview</title>
<style>
  :root {
    --primary: #6366F1;
    --primary-dark: #4338CA;
    --primary-light: #818CF8;
    --primary-surface: #EEF2FF;
    --primary-border: #C7D2FE;
    --text: #1A2B4A;
    --text-secondary: #6B7C93;
    --text-light: #9CA8B8;
    --border: #E2E8F0;
    --surface: #FFFFFF;
    --error: #F44336;
    --success: #4CAF50;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .preview-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .preview-title {
    color: rgba(255,255,255,0.5);
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Phone frame */
  .phone {
    width: 375px;
    height: 812px;
    background: #000;
    border-radius: 54px;
    padding: 12px;
    position: relative;
    box-shadow:
      0 0 0 2px #3a3a4a,
      0 40px 80px rgba(0,0,0,0.7),
      inset 0 0 0 2px #1a1a2a;
    overflow: hidden;
  }

  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    background: #000;
  }

  /* Status bar */
  .status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px 0;
    z-index: 10;
    pointer-events: none;
  }

  .status-bar.dark { color: white; }
  .status-bar.light { color: var(--text); }

  .status-time { font-size: 15px; font-weight: 600; }
  .status-icons { display: flex; align-items: center; gap: 6px; font-size: 13px; }

  /* ============ SPLASH SCREEN ============ */
  #splash {
    position: absolute;
    inset: 0;
    background: linear-gradient(145deg, #4338CA 0%, #6366F1 55%, #818CF8 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 5;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  #splash.fade-out {
    opacity: 0;
    transform: scale(1.04);
    pointer-events: none;
  }

  .splash-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    animation: fadeUp 0.7s ease forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .splash-icon-box {
    width: 100px;
    height: 100px;
    border-radius: 32px;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
    backdrop-filter: blur(10px);
  }

  .splash-icon-box svg { width: 52px; height: 52px; fill: white; }

  .splash-app-name {
    font-size: 28px;
    font-weight: 700;
    color: white;
    letter-spacing: 0.4px;
  }

  .splash-tagline {
    font-size: 14px;
    color: rgba(255,255,255,0.75);
  }

  .splash-loader-wrap {
    position: absolute;
    bottom: 80px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
  }

  .splash-loader-track {
    width: 200px;
    height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    overflow: hidden;
  }

  .splash-loader-bar {
    height: 100%;
    background: rgba(255,255,255,0.9);
    border-radius: 2px;
    width: 0%;
    transition: width linear;
  }

  .skip-hint {
    position: absolute;
    bottom: 44px;
    left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,0.45);
    cursor: pointer;
    user-select: none;
  }
  .skip-hint:hover { color: rgba(255,255,255,0.8); }

  /* ============ LOGIN SCREEN ============ */
  #login {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }

  #login.visible {
    opacity: 1;
    pointer-events: all;
  }

  .login-gradient {
    background: linear-gradient(145deg, #4338CA 0%, #6366F1 100%);
    padding: 52px 24px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .login-icon-box {
    width: 68px;
    height: 68px;
    border-radius: 22px;
    background: rgba(255,255,255,0.18);
    border: 1.5px solid rgba(255,255,255,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 4px;
  }

  .login-icon-box svg { width: 34px; height: 34px; fill: white; }

  .login-app-name {
    font-size: 22px;
    font-weight: 700;
    color: white;
    letter-spacing: 0.3px;
  }

  .login-subtitle {
    font-size: 13px;
    color: rgba(255,255,255,0.72);
  }

  .login-sheet {
    flex: 1;
    background: var(--primary-surface);
    border-radius: 28px 28px 0 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 20px 20px 48px;
    scrollbar-width: none;
  }

  .login-sheet::-webkit-scrollbar { display: none; }

  /* Section labels */
  .section-label {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    margin-bottom: 8px;
  }

  .section-label svg { width: 14px; height: 14px; fill: var(--primary); }

  .section-label-text {
    font-size: 11px;
    font-weight: 700;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 0.7px;
  }

  /* Cards */
  .card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
  }

  /* Form fields */
  .field-group { margin-bottom: 14px; }

  .field-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }

  .input-row {
    display: flex;
    align-items: center;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: var(--primary-surface);
    padding: 0 14px;
    height: 50px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .input-row:focus-within {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    background: white;
  }

  .input-row.error { border-color: var(--error); }

  .input-icon { margin-right: 8px; flex-shrink: 0; }
  .input-icon svg { width: 18px; height: 18px; fill: var(--text-secondary); display: block; }

  .input-row input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 15px;
    color: var(--text);
    font-family: inherit;
  }

  .input-row input::placeholder { color: var(--text-light); }

  .eye-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
  }

  .eye-btn svg { width: 18px; height: 18px; fill: var(--text-secondary); }

  .error-text { font-size: 11px; color: var(--error); margin-top: 4px; }

  .forgot-wrap { text-align: right; margin: -4px 0 14px; }
  .forgot-link { font-size: 12px; font-weight: 600; color: var(--primary); text-decoration: none; }

  .btn-primary {
    width: 100%;
    height: 52px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s, transform 0.1s;
    box-shadow: 0 2px 8px rgba(99,102,241,0.3);
  }

  .btn-primary:hover { opacity: 0.92; }
  .btn-primary:active { transform: scale(0.98); }

  /* OR Divider */
  .or-divider {
    display: flex;
    align-items: center;
    margin: 18px 0;
    gap: 12px;
  }

  .or-line { flex: 1; height: 1px; background: var(--border); }
  .or-text { font-size: 12px; color: var(--text-secondary); font-weight: 500; }

  /* Biometric card */
  .bio-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 20px;
    gap: 12px;
  }

  .bio-btn {
    width: 76px;
    height: 76px;
    border-radius: 24px;
    background: var(--primary);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(99,102,241,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .bio-btn:hover { transform: scale(1.04); box-shadow: 0 6px 20px rgba(99,102,241,0.5); }
  .bio-btn:active { transform: scale(0.96); }
  .bio-btn svg { width: 38px; height: 38px; fill: white; }

  .bio-hint { font-size: 13px; color: var(--text-secondary); text-align: center; }

  .placeholder-badge {
    background: var(--primary-surface);
    border-radius: 100px;
    padding: 4px 12px;
  }

  .placeholder-text { font-size: 11px; color: var(--primary); font-weight: 600; }

  /* QPIN */
  .dot-row {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 20px;
  }

  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid var(--primary-border);
    background: transparent;
    transition: all 0.15s;
  }

  .dot.filled {
    background: var(--primary);
    border-color: var(--primary);
    transform: scale(1.1);
  }

  .numpad { display: flex; flex-direction: column; gap: 10px; }
  .num-row { display: flex; gap: 10px; }

  .num-key {
    flex: 1;
    height: 54px;
    border: 1.5px solid var(--primary-border);
    background: var(--primary-surface);
    border-radius: 12px;
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.12s;
    user-select: none;
  }

  .num-key:hover { background: #e0e7ff; }
  .num-key:active { background: var(--primary); color: white; border-color: var(--primary); transform: scale(0.96); }
  .num-key.empty { background: transparent; border-color: transparent; cursor: default; pointer-events: none; }
  .num-key svg { width: 22px; height: 22px; fill: var(--text); }

  /* QR CTA */
  .qr-divider {
    display: flex;
    align-items: center;
    margin: 18px 0;
    gap: 8px;
  }

  .qr-divider-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    white-space: nowrap;
  }

  .qr-cta {
    display: flex;
    align-items: center;
    background: white;
    border: 1.5px solid var(--primary-border);
    border-radius: 16px;
    padding: 14px 16px;
    gap: 14px;
    cursor: pointer;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    transition: all 0.2s;
    width: 100%;
    font-family: inherit;
  }

  .qr-cta:hover { background: var(--primary-surface); border-color: var(--primary); }
  .qr-cta:active { transform: scale(0.99); }

  .qr-icon-wrap {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    background: var(--primary-surface);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .qr-icon-wrap svg { width: 28px; height: 28px; fill: var(--primary); }

  .qr-cta-text { flex: 1; text-align: left; }
  .qr-cta-title { font-size: 15px; font-weight: 700; color: var(--text); }
  .qr-cta-subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

  .qr-chevron { flex-shrink: 0; }
  .qr-chevron svg { width: 20px; height: 20px; fill: var(--primary-light); }

  /* Signup row */
  .signup-row {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 24px;
    gap: 4px;
  }

  .signup-prompt { font-size: 13px; color: var(--text-secondary); }
  .signup-link { font-size: 13px; font-weight: 600; color: var(--primary); text-decoration: none; cursor: pointer; }

  /* Screen toggle buttons below phone */
  .screen-toggles {
    display: flex;
    gap: 8px;
  }

  .toggle-btn {
    padding: 8px 18px;
    border-radius: 20px;
    border: 1.5px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.07);
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
  }

  .toggle-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
  }
</style>
</head>
<body>

<div class="preview-wrap">
  <p class="preview-title">KidConnect · Mobile Preview</p>

  <div class="phone">
    <div class="phone-screen">

      <!-- Status bar -->
      <div class="status-bar dark" id="status-bar">
        <span class="status-time">9:41</span>
        <div class="status-icons">
          <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="3" width="3" height="9" rx="1"/><rect x="4.5" y="2" width="3" height="10" rx="1"/><rect x="9" y="0" width="3" height="12" rx="1"/><rect x="13.5" y="1" width="3" height="11" rx="1"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 3C5.5 3 3.3 4.1 1.8 5.8L0 4C2 1.8 4.8.5 8 .5s6 1.3 8 3.5l-1.8 1.8C12.7 4.1 10.5 3 8 3z"/><path d="M8 7c-1.1 0-2.1.5-2.8 1.2L4 7c1.1-1.2 2.7-2 4-2s2.9.8 4 2l-1.2 1.2C10.1 7.5 9.1 7 8 7z"/><circle cx="8" cy="11" r="1.5"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12" fill="currentColor"><rect x="0" y="1" width="22" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1"/><rect x="23" y="4" width="2" height="4" rx="1"/><rect x="1.5" y="2.5" width="16" height="7" rx="1.5"/></svg>
        </div>
      </div>

      <!-- ========== SPLASH ========== -->
      <div id="splash">
        <div class="splash-content">
          <div class="splash-icon-box">
            <!-- Smiley / happy face icon -->
            <svg viewBox="0 0 24 24">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5c-2.5 0-4.5-1.5-5.3-3.5h10.6c-.8 2-2.8 3.5-5.3 3.5zm-3.5-6c-.83 0-1.5-.67-1.5-1.5S6.67 7.5 7.5 7.5 9 8.17 9 9s-.67 1.5-1.5 1.5zm7 0c-.83 0-1.5-.67-1.5-1.5S14.67 7.5 15.5 7.5 17 8.17 17 9s-.67 1.5-1.5 1.5z"/>
            </svg>
          </div>
          <div class="splash-app-name">KidConnect</div>
          <div class="splash-tagline">Safe. Simple. Reliable.</div>
        </div>
        <div class="splash-loader-wrap">
          <div class="splash-loader-track">
            <div class="splash-loader-bar" id="loader-bar"></div>
          </div>
        </div>
        <div class="skip-hint" onclick="goToLogin()">Tap to skip →</div>
      </div>

      <!-- ========== LOGIN ========== -->
      <div id="login">

        <!-- Gradient header -->
        <div class="login-gradient">
          <div class="login-icon-box">
            <svg viewBox="0 0 24 24">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5c-2.5 0-4.5-1.5-5.3-3.5h10.6c-.8 2-2.8 3.5-5.3 3.5zm-3.5-6c-.83 0-1.5-.67-1.5-1.5S6.67 7.5 7.5 7.5 9 8.17 9 9s-.67 1.5-1.5 1.5zm7 0c-.83 0-1.5-.67-1.5-1.5S14.67 7.5 15.5 7.5 17 8.17 17 9s-.67 1.5-1.5 1.5z"/>
            </svg>
          </div>
          <div class="login-app-name">KidConnect</div>
          <div class="login-subtitle">Parent Portal</div>
        </div>

        <!-- Sheet -->
        <div class="login-sheet">

          <!-- Email/Password -->
          <div class="section-label">
            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            <span class="section-label-text">Email &amp; Password</span>
          </div>
          <div class="card">
            <div class="field-group">
              <label class="field-label">Email Address</label>
              <div class="input-row" id="email-row">
                <span class="input-icon"><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg></span>
                <input type="email" placeholder="you@example.com" id="email-input">
              </div>
              <div class="error-text" id="email-error" style="display:none"></div>
            </div>
            <div class="field-group">
              <label class="field-label">Password</label>
              <div class="input-row" id="pw-row">
                <span class="input-icon"><svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg></span>
                <input type="password" placeholder="••••••••" id="pw-input">
                <button class="eye-btn" onclick="togglePw()" title="Toggle password">
                  <svg id="eye-icon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                </button>
              </div>
              <div class="error-text" id="pw-error" style="display:none"></div>
            </div>
            <div class="forgot-wrap"><a href="#" class="forgot-link">Forgot Password?</a></div>
            <button class="btn-primary" onclick="handleSignIn()">Sign In</button>
          </div>

          <div class="or-divider">
            <div class="or-line"></div>
            <span class="or-text">or</span>
            <div class="or-line"></div>
          </div>

          <!-- Biometric -->
          <div class="section-label">
            <svg viewBox="0 0 24 24"><path d="M12 1C8.5 1 5.5 2.5 3.5 5l1.5 1.5C6.7 4.5 9.2 3 12 3s5.3 1.5 7 3.5L20.5 5C18.5 2.5 15.5 1 12 1zm0 4c-1.7 0-3.2.7-4.3 1.7L9.2 8.2C9.9 7.5 10.9 7 12 7s2.1.5 2.8 1.2l1.5-1.5C15.2 5.7 13.7 5 12 5zm0 4c-.8 0-1.5.3-2 .8l1.5 1.5c.1-.1.3-.3.5-.3s.4.1.5.3l1.5-1.5c-.5-.5-1.2-.8-2-.8zm0 3c-.6 0-1 .4-1 1v4c0 .6.4 1 1 1s1-.4 1-1v-4c0-.6-.4-1-1-1z"/></svg>
            <span class="section-label-text">Biometric Login</span>
          </div>
          <div class="card bio-card">
            <button class="bio-btn" onclick="bioAlert()">
              <svg viewBox="0 0 24 24"><path d="M12 1C8.5 1 5.5 2.5 3.5 5l1.5 1.5C6.7 4.5 9.2 3 12 3s5.3 1.5 7 3.5L20.5 5C18.5 2.5 15.5 1 12 1zm0 4c-1.7 0-3.2.7-4.3 1.7L9.2 8.2C9.9 7.5 10.9 7 12 7s2.1.5 2.8 1.2l1.5-1.5C15.2 5.7 13.7 5 12 5zm0 4c-.8 0-1.5.3-2 .8l1.5 1.5c.1-.1.3-.3.5-.3s.4.1.5.3l1.5-1.5c-.5-.5-1.2-.8-2-.8zm0 3c-.6 0-1 .4-1 1v4c0 .6.4 1 1 1s1-.4 1-1v-4c0-.6-.4-1-1-1z"/></svg>
            </button>
            <div class="bio-hint">Touch ID or Face ID</div>
            <div class="placeholder-badge">
              <span class="placeholder-text">Placeholder – native integration required</span>
            </div>
          </div>

          <div class="or-divider">
            <div class="or-line"></div>
            <span class="or-text">or</span>
            <div class="or-line"></div>
          </div>

          <!-- QPIN -->
          <div class="section-label">
            <svg viewBox="0 0 24 24"><path d="M3 3h4v4H3zm7 0h4v4h-4zm7 0h4v4h-4zM3 10h4v4H3zm7 0h4v4h-4zm7 0h4v4h-4zM3 17h4v4H3zm7 0h4v4h-4zm7 0h4v4h-4z"/></svg>
            <span class="section-label-text">Quick PIN (QPIN)</span>
          </div>
          <div class="card">
            <div class="dot-row" id="dot-row">
              <div class="dot" id="d0"></div>
              <div class="dot" id="d1"></div>
              <div class="dot" id="d2"></div>
              <div class="dot" id="d3"></div>
              <div class="dot" id="d4"></div>
              <div class="dot" id="d5"></div>
            </div>
            <div class="numpad">
              <div class="num-row">
                <button class="num-key" onclick="pinPress('1')">1</button>
                <button class="num-key" onclick="pinPress('2')">2</button>
                <button class="num-key" onclick="pinPress('3')">3</button>
              </div>
              <div class="num-row">
                <button class="num-key" onclick="pinPress('4')">4</button>
                <button class="num-key" onclick="pinPress('5')">5</button>
                <button class="num-key" onclick="pinPress('6')">6</button>
              </div>
              <div class="num-row">
                <button class="num-key" onclick="pinPress('7')">7</button>
                <button class="num-key" onclick="pinPress('8')">8</button>
                <button class="num-key" onclick="pinPress('9')">9</button>
              </div>
              <div class="num-row">
                <button class="num-key empty"></button>
                <button class="num-key" onclick="pinPress('0')">0</button>
                <button class="num-key" onclick="pinDelete()">
                  <svg viewBox="0 0 24 24"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/></svg>
                </button>
              </div>
            </div>
          </div>

          <!-- QR Scan CTA -->
          <div class="qr-divider">
            <div class="or-line"></div>
            <span class="qr-divider-label">Child sign in / sign out</span>
            <div class="or-line"></div>
          </div>

          <button class="qr-cta" onclick="qrAlert()">
            <div class="qr-icon-wrap">
              <svg viewBox="0 0 24 24"><path d="M3 11h2v2H3zm0-4h2v2H3zm4 0h1v2H7zm-4 4h2v2H3zm4 4h1v2H7zm-4 4h2v2H3zm4 0h1v2H7zm8-12h2v2h-2zm0 4h2v2h-2zm4-4h1v2h-1zm0 4h1v2h-1zm-4 4h2v2h-2zm4 0h1v2h-1zm-4 4h2v2h-2zm4 0h1v2h-1zM5 3H3v2h2v2h2V5H5zm8 0h-2v2h2v2h2V5h-2zM5 13H3v2h2v2h2v-2H5zm8 0h-2v2h2v2h2v-2h-2z"/></svg>
            </div>
            <div class="qr-cta-text">
              <div class="qr-cta-title">Scan QR Code</div>
              <div class="qr-cta-subtitle">Child sign in &amp; sign out</div>
            </div>
            <div class="qr-chevron">
              <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </div>
          </button>

          <div class="signup-row">
            <span class="signup-prompt">New parent? </span>
            <a href="#" class="signup-link">Create Account</a>
          </div>

        </div><!-- end sheet -->
      </div><!-- end login -->

    </div><!-- phone-screen -->
  </div><!-- phone -->

  <div class="screen-toggles">
    <button class="toggle-btn active" id="btn-splash" onclick="showSplash()">Splash Screen</button>
    <button class="toggle-btn" id="btn-login" onclick="goToLogin()">Login Screen</button>
  </div>
</div>

<script>
  let pin = '';
  let splashRunning = false;

  function startSplash() {
    splashRunning = true;
    const bar = document.getElementById('loader-bar');
    bar.style.transition = 'none';
    bar.style.width = '0%';
    void bar.offsetWidth;
    bar.style.transition = 'width 5s linear';
    bar.style.width = '100%';
    setTimeout(() => { if (splashRunning) goToLogin(); }, 5000);
  }

  function showSplash() {
    splashRunning = false;
    const splash = document.getElementById('splash');
    const login = document.getElementById('login');
    const statusBar = document.getElementById('status-bar');
    splash.classList.remove('fade-out');
    login.classList.remove('visible');
    statusBar.classList.remove('light');
    statusBar.classList.add('dark');
    document.getElementById('btn-splash').classList.add('active');
    document.getElementById('btn-login').classList.remove('active');
    setTimeout(startSplash, 100);
  }

  function goToLogin() {
    splashRunning = false;
    const splash = document.getElementById('splash');
    const login = document.getElementById('login');
    const statusBar = document.getElementById('status-bar');
    splash.classList.add('fade-out');
    login.classList.add('visible');
    statusBar.classList.remove('dark');
    statusBar.classList.add('light');
    document.getElementById('btn-login').classList.add('active');
    document.getElementById('btn-splash').classList.remove('active');
  }

  function togglePw() {
    const input = document.getElementById('pw-input');
    const icon = document.getElementById('eye-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.innerHTML = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>';
    } else {
      input.type = 'password';
      icon.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
    }
  }

  function handleSignIn() {
    const email = document.getElementById('email-input').value;
    const pw = document.getElementById('pw-input').value;
    const emailRow = document.getElementById('email-row');
    const pwRow = document.getElementById('pw-row');
    const emailErr = document.getElementById('email-error');
    const pwErr = document.getElementById('pw-error');
    let valid = true;

    emailRow.classList.remove('error'); emailErr.style.display = 'none';
    pwRow.classList.remove('error'); pwErr.style.display = 'none';

    if (!email) {
      emailRow.classList.add('error'); emailErr.textContent = 'Email is required'; emailErr.style.display = 'block'; valid = false;
    } else if (!/\S+@\S+\.\S+/.test(email)) {
      emailRow.classList.add('error'); emailErr.textContent = 'Enter a valid email address'; emailErr.style.display = 'block'; valid = false;
    }
    if (!pw) {
      pwRow.classList.add('error'); pwErr.textContent = 'Password is required'; pwErr.style.display = 'block'; valid = false;
    } else if (pw.length < 6) {
      pwRow.classList.add('error'); pwErr.textContent = 'Password must be at least 6 characters'; pwErr.style.display = 'block'; valid = false;
    }
    if (valid) alert('✓ Sign In triggered (demo)');
  }

  function pinPress(digit) {
    if (pin.length >= 6) return;
    pin += digit;
    updateDots();
    if (pin.length === 6) {
      setTimeout(() => {
        alert('QPIN submitted: ' + pin + '\n(any 6 digits accepted in demo)');
        pin = '';
        updateDots();
      }, 200);
    }
  }

  function pinDelete() {
    pin = pin.slice(0, -1);
    updateDots();
  }

  function updateDots() {
    for (let i = 0; i < 6; i++) {
      document.getElementById('d' + i).classList.toggle('filled', i < pin.length);
    }
  }

  function bioAlert() {
    alert('Face ID / Touch ID\nPlaceholder – requires expo-local-authentication in the native app.');
  }

  function qrAlert() {
    alert('Scan QR Code\nCamera integration required for child sign in / sign out.');
  }

  // Auto-start splash on load
  window.addEventListener('load', startSplash);
</script>
</body>
</html>
